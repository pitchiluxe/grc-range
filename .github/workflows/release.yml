name: Release

# Builds and publishes installers to a GitHub Release whenever a tag matching
# v* is pushed (e.g. v1.1.0). Runs on GitHub-hosted runners so a build is not
# dependent on any one contributor's local machine/AV/indexer state.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx tsc -p electron/tsconfig.json

      - name: Build and publish (${{ matrix.target }})
        run: npx electron-builder --${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificate is configured for this open-source
          # project; disable auto-discovery so electron-builder does not try
          # (and fail) to find one on the macOS runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: false
